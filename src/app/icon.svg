<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Fix-It Registry">
  <!--
    The header logo, as a favicon: the enamel machined square from
    `site-header.tsx` with lucide's Wrench glyph in bench.

    Two deliberate departures from the header, both because a favicon renders at
    16px where the header mark renders at 28px:

      · The glyph fills ~62% of the tile rather than the header's 57%. At 16px a
        proportionally smaller wrench reads as a smudge.
      · Stroke is 2.6 in the icon's own 24-unit space rather than lucide's
        default 2, so after the 0.8333 scale it lands near 2.17 device units and
        survives downsampling to 16px.

    Corner radius 6 on a 32 tile is the same ratio as the token's 4px radius on
    the header's 28px box — `--radius-machined` scaled, not softened.
  -->
  <rect width="32" height="32" rx="6" fill="#123b4a" />
  <g
    transform="translate(6 6) scale(0.8333)"
    fill="none"
    stroke="#eef1f4"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
  </g>
</svg>
